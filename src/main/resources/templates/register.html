<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
  <section class="active">
    <img src="/imagenes/imagens.jpg" alt="Cafe" class="top-image" />
    <div class="beige-curve">
      <div class="form-box">
        <h1>Regístrate</h1>
        <form th:action="@{/register}" method="post" th:object="${usuario}">

          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" th:field="*{nombre}" placeholder="Nombre y Apellido" required>

          <label for="correo">Correo institucional</label>
          <input type="email" id="correo" th:field="*{correo}" placeholder="u1234567@utp.edu.pe"
            title="Debe ser un correo institucional válido" required>

          <label for="password">Contraseña</label>
          <input type="password" id="password" th:field="*{password}" placeholder="Contraseña" required>

          <label for="confirm">Confirmar contraseña</label>
          <input type="password" id="confirm" name="confirm" placeholder="Confirmar Contraseña" required>

          <input type="hidden" th:field="*{rol}" value="USUARIO" />
          <input type="hidden" th:field="*{estado}" value="true" />

          <div th:if="${error}" class="error-message" th:text="${error}"></div>

          <button type="submit">Registrarse</button>
        </form>
        <div class="link">
          <a th:href="@{/loguin}">¿Ya tienes cuenta? Inicia sesión aquí</a>
        </div>
      </div>
    </div>
  </section>
</body>

</html>
