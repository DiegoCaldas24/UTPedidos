<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTPedidos - Inicio</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
    <!-- Navbar -->
    <div th:replace="fragments/Navbar :: navbar"></div>

    <!-- Contenido principal -->
    <main class="container mt-4">
        <h1 class="text-center mb-4">Bienvenido a UTPedidos</h1>
        
        <!-- Mensajes flash -->
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Lista de productos -->
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div th:each="producto : ${productos}" class="col">
                <div class="card h-100">
                    <img th:if="${producto.imagenUrl}" th:src="${producto.imagenUrl}" class="card-img-top" alt="Imagen del producto">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${producto.nombre}"></h5>
                        <p class="card-text" th:text="${producto.descripcion}"></p>
                        <p class="card-text"><strong>Precio: </strong><span th:text="${#numbers.formatCurrency(producto.precio)}"></span></p>
                        <p class="card-text"><strong>Stock: </strong><span th:text="${producto.stock}"></span></p>
                        <form th:action="@{/carrito/agregar}" method="post">
                            <input type="hidden" name="idProducto" th:value="${producto.id}">
                            <div class="input-group mb-3">
                                <input type="number" name="cantidad" class="form-control" value="1" min="1" th:max="${producto.stock}">
                                <button class="btn btn-primary" type="submit">Agregar al carrito</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
