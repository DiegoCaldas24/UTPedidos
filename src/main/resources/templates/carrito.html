<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Carrito</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fuentes -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/style.css}" />

    <script th:src="@{/js/botones.js}"></script>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg custom-navbar">
            <div class="container-fluid">
                <!-- LOGO -->
                <a class="navbar-brand d-flex align-items-center me-4" href="#">
                    <span class="logo-coffee">Coffee</span>
                    <span class="logo-utpedidos">UTPedidos</span>
                </a>

                <!-- Botón responsive -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Contenido navbar -->
                <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                    <!-- Enlaces a la izquierda -->
                    <ul class="navbar-nav gap-4">
                        <li class="nav-item">
                            <a class="nav-link nav-link-custom" href="#">MENÚ</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-custom" href="#">CARRITO</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-custom" href="#">PEDIDOS</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="tabla-contenedor">
                    <div class="table-responsive">
                        <table class="align-middle text-center w-100">
                            <thead>
                                <tr>
                                    <th>Imagen</th>
                                    <th>Producto</th>
                                    <th>Cantidad</th>
                                    <th>Precio unitario</th>
                                    <th>Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${carrito}">
                                    <td th:text="${item.producto.imagenUrl}"></td>
                                    <td th:text="${item.producto.nombre}"></td>
                                    <td th:text="${item.cantidad}"></td>
                                    <td th:text="${item.producto.precio}"></td>
                                    <td th:text="${item.total}"></td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="4"></td> <!-- Celdas vacías para alinear -->
                                    <td><strong>Total:</strong></td>
                                    <td><strong></strong></td>
                                </tr>
                            </tfoot>
                        </table>
                        <div class="botones d-grid gap-2 d-md-flex justify-content-md-end mt-3">
                            <button class="btn1 btn w-100 w-md-auto">Añadir producto</button>
                            <button class="btn2 btn w-100 w-md-auto">Pagar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
