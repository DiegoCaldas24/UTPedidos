<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::title},~{::main},~{::script})}">

<head>
    <title>TuPedido</title>
</head>

<body>
    <main>
        <div class="container py-5">
            <div class="card shadow-lg text-center">
                <div class="card-body">
                    <h2 class="card-title">¡Gracias por tu compra!</h2>
                    <h4 class="mt-4">Código de pedido:</h4>
                    <h1 class="display-4 fw-bold text-primary" th:text="${codigoPedido}">COD123</h1> <button
                        class="btn btn-outline-primary mt-4" data-bs-toggle="modal" data-bs-target="#detallesModal">
                        Mostrar detalles </button>
                </div>
            </div>
        </div>
        <!-- Modal para mostrar detalles -->
        <div class="modal fade" id="detallesModal" tabindex="-1" aria-labelledby="detallesModalLabel"
            aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content p-3">
                    <div class="modal-header">
                        <h5 class="modal-title" id="detallesModalLabel">Detalles del Pedido</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <h6>Productos en tu carrito:</h6>
                        <ul class="list-group">
                            <li th:each="item : ${carrito}"
                                class="list-group-item d-flex justify-content-between align-items-center">
                                <span th:text="${item.producto.nombre}">Nombre Producto</span>
                                <span>Cantidad: <b th:text="${item.cantidad}">1</b></span>
                                <span>Precio: S/ <b th:text="${item.producto.precio}">0.00</b></span>
                            </li>
                        </ul>
                        <hr>
                        <p>Hora para recoger: <span th:text="${horaRecoger}">--:--</span></p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script></script>
</body>

</html>
