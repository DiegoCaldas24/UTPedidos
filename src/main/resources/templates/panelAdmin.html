<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Carta - Cafetín Universitario</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Barra lateral -->
            <div class="col-md-3 sidebar">
                <div class="sidebar-header">
                    <h3>Lorem</h3>
                    <p>Panel de Administración</p>
                </div>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/productos}"><i class="fas fa-utensils me-2"></i> Gestión
                            de
                            Productos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-list me-2"></i> Lista de Espera</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-chart-bar me-2"></i> Estadísticas</a>
                        <a class="nav-link" th:href="@{/productos/estadisticas}"><i class="fas fa-chart-bar me-2"></i>
                            Estadísticas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fas fa-cog me-2"></i> Configuración</a>
                    </li>
                </ul>
            </div>

            <!-- Contenido principal -->
            <div class="col-md-9 main-content">
                <div class="header">
                    <h2>Añadir Nuevo Producto</h2>
                    <p>Completa el formulario para añadir un nuevo producto a la carta</p>
                    <div th:if="${mensaje}" class="alert alert-success" role="alert" th:text="${mensaje}"></div>
                </div>

                <div class="row mt-4">
                    <!-- Formulario para añadir producto -->
                    <div class="col-md-6">
                        <div class="card form-card">
                            <div class="card-body">
                                <div th:replace="fragments/productoForm :: productoFormFragment"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Vista previa del producto y lista de productos recientes -->
                    <div class="col-md-6">
                        <div th:replace="fragments/productoPreview :: productoPreviewFragment"></div>
                        <div th:if="${#lists.isEmpty(productos)}" class="text-muted text-center">
                            No hay productos añadidos recientemente.
                        </div>
                        <!-- Lista de productos recientes como fragmento -->
                        <div th:replace="fragments/productoLista :: productoListaFragment"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS y Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script para la vista previa de productos -->
    <script th:src="@{/js/previewProducto.js}"></script>
    <!-- Script para cargar categorías de forma asíncrona -->
</body>

</html>
