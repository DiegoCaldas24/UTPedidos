<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Fuentes -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Outfit:wght@100..900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&display=swap" rel="stylesheet">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" th:href="@{/modal.css}">
    <link rel="stylesheet" th:href="@{/cupon.css}">


    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- JS del modal -->
    <script th:src="@{/js/modal.js}" defer></script>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg custom-navbar">
            <div class="container-fluid">
                <!-- LOGO -->
                <a class="navbar-brand d-flex align-items-center me-4" href="#">
                    <span class="logo-coffee">Coffee</span>
                    <span class="logo-utpedidos">UTPedidos</span>
                </a>

                <!-- Botón responsive -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Contenido navbar -->
                <div class="collapse navbar-collapse justify-content-between" id="navbarNav">
                    <!-- Enlaces a la izquierda -->
                    <ul class="navbar-nav gap-4">
                        <li class="nav-item">
                            <a class="nav-link nav-link-custom" href="#">MENÚ</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-custom" href="#">CARRITO</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link nav-link-custom" href="#">PEDIDOS</a>
                        </li>
                    </ul>

                    <!-- Botones a la derecha -->
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-dark btn-login">INICIAR SESIÓN</button>
                        <button class="btn btn-dark btn-register">REGÍSTRATE</button>
                    </div>
                </div>
            </div>
        </nav>

    </header>

    <!-- Controles -->
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselPromos" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselPromos" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>
    </div>


    <!-- Categorías con imágenes -->
    <section class="text-center my-4">
        <div class="d-flex justify-content-center gap-3 flex-wrap">
            <a class="btn btn-filtro rounded-pill" th:href="@{/catalogo(categoria='Bebidas')}"
                th:classappend="${param.categoria} == 'Bebidas' ? ' btn-primary text-white' : ''">
                <img th:src="@{/imagenes/bebidas.png}" alt="Bebidas">
                Bebidas
            </a>

            <a class="btn btn-filtro rounded-pill" th:href="@{/catalogo(categoria='Snacks')}"
                th:classappend="${param.categoria} == 'Snacks' ? ' btn-primary text-white' : ''">
                <img th:src="@{/imagenes/snakcs.png}" alt="Snacks">
                Snacks
            </a>

            <a class="btn btn-filtro rounded-pill" th:href="@{/catalogo(categoria='Postres')}"
                th:classappend="${param.categoria} == 'Postres' ? ' btn-primary text-white' : ''">
                <img th:src="@{/imagenes/postres.png}" alt="Postres">
                Postres
            </a>

            <a class="btn btn-filtro rounded-pill" th:href="@{/catalogo(categoria='Menú')}"
                th:classappend="${param.categoria} == 'Menú' ? ' btn-primary text-white' : ''">
                <img th:src="@{/imagenes/menu.png}" alt="Menú">
                Menú
            </a>
        </div>
    </section>

    <script>
        function copiarCodigo(index) {
            const input = document.getElementById('codigo-' + index);
            input.select();
            input.setSelectionRange(0, 99999); // Móvil
            document.execCommand('copy');
            alert('¡Cupón copiado: ' + input.value + '!');
        }
    </script>
    </div>

    <!-- Cards de productos -->
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4 mb-4" th:each="producto : ${productos}">
                <div class="card h-100 shadow-sm">
                    <img th:src="@{${producto.imagen}}" class="card-img-top" alt="Imagen del producto"
                        style="height: 200px; object-fit: cover;">
                    <div class="card-body d-flex flex-column text-center">
                        <h5 class="card-title" th:text="${producto.nombre}"></h5>
                        <p class="card-text text-muted">S/. <span th:text="${producto.precio}"></span></p>
                        <p class="card-text small text-warning">Rating: <span th:text="${producto.rating}"></span> ⭐</p>
                        <button class="btn btn-success mt-auto"
                            th:attr="data-nombre=${producto.nombre}, data-precio=${producto.precio}"
                            onclick="abrirModal(this)">
                            Ver detalle
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modalDetalle" class="modal">
        <div class="modal-contenido">
            <span class="cerrar" onclick="cerrarModal()">&times;</span>
            <h2 id="modalNombre"></h2>
            <p id="modalPrecio"></p>
            <form method="post" th:action="@{/pedido/registrar}">
                <input type="hidden" name="nombreProducto" id="nombreProducto">
                <label for="cantidad">Cantidad:</label>
                <input type="number" name="cantidad" min="1" value="1" required>
                <button type="submit">Agregar al carrito</button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
